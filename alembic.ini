# Alembic configuration for developer commands, e.g.:
#
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate --rev-id 0002 -m "describe change"
#
# The database URL is taken from EASYRAG_DATABASE_URL (see .env.example), never from this file.
# Containers do not use this file: they run `python -m easyrag.storage.migrate`.

[alembic]
script_location = %(here)s/src/easyrag/storage/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
