# EasyRAG: put Markdown files in ./docs, then
#
#   docker compose up -d        and open http://localhost:8000
#
# No configuration is required. Optional settings go in .env (see .env.example).
# Use a host Ollama instead of the bundled one: see docker-compose.host-ollama.yml.

name: easyrag

# Bounded container logs (Docker's default json-file log grows without limit).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # One-shot: provides the database password as a file in the "secrets" volume.
  # POSTGRES_PASSWORD from .env if set (installations from before this file existed), else a
  # random one generated on first start. PostgreSQL reads it only when it first creates its
  # data, so changing it later has no effect on an existing database.
  init:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    entrypoint: ["/bin/sh", "-ceu"]
    command:
      - |
        file=/run/easyrag/secrets/postgres_password
        if [ -n "$${POSTGRES_PASSWORD:-}" ]; then
          printf %s "$$POSTGRES_PASSWORD" > "$$file"
        elif [ ! -s "$$file" ]; then
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$file"
          echo "Generated a database password (volume: secrets)"
        fi
        chmod 0444 "$$file"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - secrets:/run/easyrag/secrets
    network_mode: none
    restart: "no"
    logging: *logging

  app:
    build: .
    image: easyrag:local
    env_file:
      - path: .env
        required: false
    environment:
      EASYRAG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-easyrag}@db:5432/${POSTGRES_DB:-easyrag}
      EASYRAG_DATABASE_PASSWORD_FILE: /run/easyrag/secrets/postgres_password
      EASYRAG_OLLAMA_BASE_URL: ${EASYRAG_OLLAMA_BASE_URL:-http://ollama:11434}
      EASYRAG_DOCS_DIR: /data/docs
      EASYRAG_MODEL_CACHE_DIR: /data/models
      # Model libraries write caches and logs under their "home"; the root filesystem is
      # read-only, so point them at the models volume. And no telemetry (local-first).
      HF_HOME: /data/models/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      ORT_DISABLE_TELEMETRY: "1"
    volumes:
      # Your Markdown documents, mounted read-only.
      - ${EASYRAG_DOCS_HOST_DIR:-./docs}:/data/docs:ro
      # Downloaded reranker model (once; then used offline).
      - models:/data/models
      - secrets:/run/easyrag/secrets:ro
    ports:
      # Published on localhost only. Before publishing it more widely, set EASYRAG_API_KEY
      # in .env, and put a TLS-terminating reverse proxy in front.
      - "127.0.0.1:${EASYRAG_PORT:-8000}:8000"
    # Not depending on ollama on purpose: the app starts while models download (or when
    # Ollama runs on the host); /health/ready reports them as "pulling" or "missing".
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${EASYRAG_APP_MEMORY_LIMIT:-1g}
    logging: *logging

  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easyrag}
      POSTGRES_PASSWORD_FILE: /run/easyrag/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-easyrag}
    volumes:
      # PostgreSQL 18 images keep data in a version-specific subdirectory of this path.
      - pgdata:/var/lib/postgresql
      - secrets:/run/easyrag/secrets:ro
    # Docker's 64 MB default is too small for parallel HNSW index builds on larger corpora.
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${EASYRAG_DB_MEMORY_LIMIT:-1g}
    logging: *logging
    # Not published to the host. For development access use docker-compose.dev.yml.

  ollama:
    image: ollama/ollama:0.34.4
    environment:
      # Keep models loaded between questions (reloading costs ~10 s on CPU).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1h}
      # One request at a time: each parallel slot multiplies the context memory.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      # The embedding model and the chat model stay loaded together.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    volumes:
      - ollama:/root/.ollama  # downloaded models survive restarts
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Enough for the default models; raise it for larger chat models (.env.example).
          memory: ${EASYRAG_OLLAMA_MEMORY_LIMIT:-3g}
    logging: *logging
    # Not published to the host. For development access use docker-compose.dev.yml.

volumes:
  pgdata:
  ollama:
  models:
  secrets:
