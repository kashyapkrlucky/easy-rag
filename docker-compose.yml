name: easyrag

services:
  app:
    build: .
    image: easyrag:local
    env_file:
      - path: .env
        required: false
    environment:
      EASYRAG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-easyrag}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB:-easyrag}
      # Point at the host's Ollama instead with http://host.docker.internal:11434
      EASYRAG_OLLAMA_BASE_URL: ${EASYRAG_OLLAMA_BASE_URL:-http://ollama:11434}
      EASYRAG_DOCS_DIR: /data/docs
      EASYRAG_MODEL_CACHE_DIR: /data/models
      # Model libraries write caches and logs under their "home"; the root filesystem is
      # read-only, so point them at the models volume. And no telemetry (local-first).
      HF_HOME: /data/models/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      ORT_DISABLE_TELEMETRY: "1"
    volumes:
      # Your Markdown documents, mounted read-only.
      - ${EASYRAG_DOCS_HOST_DIR:-./docs}:/data/docs:ro
      # Downloaded reranker model (once; then used offline).
      - models:/data/models
    ports:
      # Published on localhost only. Before publishing it more widely, set EASYRAG_API_KEY
      # in .env, and put a TLS-terminating reverse proxy in front.
      - "127.0.0.1:${EASYRAG_PORT:-8000}:8000"
    # Not waiting for ollama-pull on purpose: the API starts even if the model download
    # is slow or impossible (offline); /health/ready reports the model as "missing".
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easyrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-easyrag}
    volumes:
      # PostgreSQL 18 images keep data in a version-specific subdirectory of this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # Not published to the host. For development access use docker-compose.dev.yml.

  ollama:
    image: ollama/ollama:0.34.4
    volumes:
      - ollama:/root/.ollama  # downloaded models survive restarts
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # Not published to the host. For development access use docker-compose.dev.yml.

  # One-shot: downloads the embedding and chat models (no-ops when already present), then exits.
  ollama-pull:
    image: ollama/ollama:0.34.4
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$EMBEDDING_MODEL\" && ollama pull \"$$LLM_MODEL\""]
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EASYRAG_EMBEDDING_MODEL:-nomic-embed-text:v1.5}
      LLM_MODEL: ${EASYRAG_LLM_MODEL:-qwen2.5:1.5b-instruct-q4_K_M}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  ollama:
  models:
